# Outline - Local Docker deployment
# Access: http://localhost:8080 (Outline) | http://localhost:8025 (Mailhog - sign-in links)

services:
  outline:
    image: outlinewiki/outline:1.4.0
    env_file: ./docker.env
    ports:
      - "0.0.0.0:8080:3000"
    volumes:
      - storage-data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - ./redis.conf:/redis.conf
    command: ["redis-server", "/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: ./docker.env
    expose:
      - "5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: outline_password_change_me
      POSTGRES_DB: outline
    restart: unless-stopped

volumes:
  storage-data:
  database-data:
