name: Build and Deploy Outline to Azure Container Apps

on:
  push:
    branches:
      - main

env:
  RESOURCE_GROUP: outline-wiki-rg
  CONTAINER_APP_NAME: outline-wiki
  CONTAINER_APP_ENV: outline-wiki-env
  ACR_LOGIN_SERVER: hdinfrastructurecontainerregistry.azurecr.io
  ACR_NAME: hdinfrastructurecontainerregistry
  IMAGE_NAME: outline-wiki

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Outline image
        run: |
          IMAGE_TAG=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker tag $IMAGE_TAG ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push $IMAGE_TAG
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Redis image to ACR
        run: |
          docker pull redis:7-alpine
          docker tag redis:7-alpine ${{ env.ACR_LOGIN_SERVER }}/redis:7-alpine
          docker push ${{ env.ACR_LOGIN_SERVER }}/redis:7-alpine

      - name: Create deploy config (Outline + Redis sidecar)
        run: |
          OUTLINE_IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          REDIS_IMAGE="${{ env.ACR_LOGIN_SERVER }}/redis:7-alpine"
          printf 'properties:\n  configuration:\n    ingress:\n      external: true\n      targetPort: 3000\n  template:\n    containers:\n      - name: outline-wiki\n        image: %s\n        resources:\n          cpu: 0.5\n          memory: 1Gi\n      - name: redis\n        image: %s\n        resources:\n          cpu: 0.25\n          memory: 0.5Gi\n' "$OUTLINE_IMAGE" "$REDIS_IMAGE" > azure-containerapp.yaml

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          acrName: ${{ env.ACR_NAME }}
          acrUsername: ${{ secrets.ACR_USERNAME }}
          acrPassword: ${{ secrets.ACR_PASSWORD }}
          yamlConfigPath: azure-containerapp.yaml
